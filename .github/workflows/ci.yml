name: ci
on:
  pull_request:
    # labeled/unlabeled: guards read PR labels (no-test-needed, security-reviewed)
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run test:unit
      - run: bash -n scripts/*.sh
  guards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/ci/run.ts
  # L1 static checks (C1). Separate jobs so each shows up as its own status.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version && shellcheck scripts/*.sh
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Current tree + every commit this PR/push adds (a secret added and then
      # deleted in a later commit still lands in history).
      - env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          img=zricethezav/gitleaks:v8.30.1
          docker run --rm -v "$PWD:/repo" "$img" dir --no-banner --redact /repo
          docker run --rm -v "$PWD:/repo" "$img" git --no-banner --redact --log-opts="$RANGE" /repo
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --include=dev
      - run: npm run lint
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --include=dev
      - run: npm run test:coverage
