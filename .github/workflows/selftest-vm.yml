name: selftest-vm
# L2 guard (C3): the PR's code runs as a throwaway candidate instance on the real
# machine (gVisor, network policy) and must pass failure modes + isolation + redaction.
# Production service and its data are not touched — see scripts/selftest-candidate.sh.
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: selftest-vm-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  selftest-vm:
    # Only branches of this repo: fork code must never reach the machine (fork PRs
    # additionally need maintainer approval to run Actions at all).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, sar-machine]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/selftest-candidate.sh
        env:
          SAR_CI_REPORT_DIR: ${{ runner.temp }}/selftest-report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-vm-report
          path: ${{ runner.temp }}/selftest-report
          if-no-files-found: ignore
